version: "3.1"
services:
  db:
    container_name: postgres
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: example
    networks:
    - backbone
    ports:
    - 127.0.0.1:5432:5432

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - 127.0.0.1:8080:8080
    networks:
    - backbone

networks:
  backbone: