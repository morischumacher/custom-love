version: "3.1"
services:
  mariadb:
    container_name: 'mariadb'
    image: mariadb:latest
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'true'
    restart: unless-stopped
    ports:
      - 3808:3808
    networks:
      - backbone
    volumes:
      - ./mariadb:/var/lib/mysql

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: 'mariadb'
    networks:
      - backbone
    ports:
      - 9092:80

  app:
    container_name: app
    build:
      context: .
      dockerfile: ./containers/development.Dockerfile
    volumes:
      - .:/var/inso_06
    image: development
    networks:
      - backbone
    restart: unless-stopped
    ports:
      - 8000:8000
    profiles:
      - "manual"

networks:
  backbone: